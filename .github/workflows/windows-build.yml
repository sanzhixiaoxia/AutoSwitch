name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Electron runtime
        uses: actions/cache@v4
        with:
          path: .electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Windows installer and portable ZIP
        run: npm run dist

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoSwitch-Windows-${{ github.sha }}
          path: |
            dist/AutoSwitch-Setup-*.exe
            dist/AutoSwitch-Portable-*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/AutoSwitch-Setup-*.exe \
            dist/AutoSwitch-Portable-*.zip \
            dist/*.sha256 \
            --title "AutoSwitch ${GITHUB_REF_NAME}" \
            --generate-notes
